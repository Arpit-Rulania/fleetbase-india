server {
    listen       4200;
    server_name  localhost;

    location ~* \.map$ {
        deny all;
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }

     # Serve runtime config with no cache
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }

    # Fallback placeholder images — serve from /images/fallbacks/ if present,
    # otherwise return a simple neutral SVG so no request leaks to upstream CDN.
    location /images/fallbacks/ {
        root /usr/share/nginx/html;
        try_files $uri @empty_image;
    }

    location @empty_image {
        add_header Content-Type "image/svg+xml";
        return 200 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="#e5e7eb"/><text x="32" y="38" text-anchor="middle" font-size="24" fill="#9ca3af">?</text></svg>';
    }
}
