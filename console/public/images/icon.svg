<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 137 137" role="img" aria-label="FleetIndia">
  <title>FleetIndia</title>
  <rect width="137" height="137" rx="10" fill="#2563eb"/>
  <!-- Stylised truck outline -->
  <g fill="#ffffff">
    <!-- Cab -->
    <rect x="72" y="50" width="32" height="26" rx="3"/>
    <!-- Cargo box -->
    <rect x="30" y="44" width="44" height="32" rx="3"/>
    <!-- Windscreen cutout (dark) -->
    <rect x="75" y="54" width="18" height="12" rx="2" fill="#2563eb"/>
    <!-- Wheels -->
    <circle cx="45" cy="82" r="9"/>
    <circle cx="95" cy="82" r="9"/>
    <circle cx="45" cy="82" r="4" fill="#2563eb"/>
    <circle cx="95" cy="82" r="4" fill="#2563eb"/>
    <!-- Road line -->
    <rect x="22" y="93" width="94" height="4" rx="2"/>
    <!-- Ashoka Chakra hint — small 24-spoke wheel motif above cab -->
    <circle cx="88" cy="30" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="88" cy="30" r="2"/>
  </g>
</svg>
